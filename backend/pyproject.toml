[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-tactical-assistant-backend"
version = "0.1.0"
description = "Backend API for AI-Driven Football Tactical Analysis and Training Evaluation System"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "python-dateutil>=2.8.2",
    "supabase>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
modal = [
    "modal>=1.5.0,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Lock async test runner to asyncio only — trio backend is not part of the production stack
anyio_backends = ["asyncio"]
